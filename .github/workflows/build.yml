name: Build TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 在云端完整构建一个合规的 Flutter 根项目
      - name: Bootstrap Complete Flutter Project
        run: |
          mkdir temp_build
          cp pubspec.yaml temp_build/
          cp -r lib temp_build/
          cd temp_build
          flutter create . --org com.example.tvktv --project-name tv_ktv
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-ktv-apk
          path: app-release.apk
