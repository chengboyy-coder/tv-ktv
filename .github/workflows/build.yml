name: Build TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Scaffold
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.tvktv
          fi

      - name: Fix Android Configuration and MinSdk
        run: |
          # 允许明文 HTTP 网络请求并注入 Android 网络权限
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest.*/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n<uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>/' android/app/src/main/AndroidManifest.xml
          
          # 提升 minSdkVersion 到 21
          find android/app/ -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android/app/ -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-ktv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
