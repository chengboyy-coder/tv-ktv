name: Build TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 安全补充 Android 模版工程
      - name: Create Android Scaffold
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.tvktv
          fi

      # 自动注入网络明文传输权限（解决局域网打不开网页的问题）
      - name: Enable Cleartext Traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-ktv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
