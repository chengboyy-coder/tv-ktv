name: Build TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. 自动补充 Android 脚手架
      - name: Create Android Scaffold
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.tvktv
          fi

      # 2. 自动修正 minSdkVersion 提升到 21，并开启网络明文传输权限
      - name: Fix Android Configuration
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # 修改 build.gradle 确保 minSdk >= 21
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-ktv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
